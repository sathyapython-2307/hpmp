{% extends 'base.html' %}
{% block title %}Delete Patient{% endblock %}
{% block page_title %}Delete Patient{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <div class="alert alert-danger">
            <h5>Are you sure you want to delete this patient?</h5>
            <p><strong>{{ patient.full_name }}</strong> ({{ patient.patient_id }})</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'patients:patient_detail' patient.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
