{% extends 'base.html' %}
{% block title %}Delete Report{% endblock %}
{% block page_title %}Delete Report{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <div class="alert alert-danger">
            <h5>Are you sure you want to delete this report?</h5>
            <p><strong>{{ report.title }}</strong></p>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'reports:patient_reports' report.patient.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
