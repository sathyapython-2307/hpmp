{% extends 'base.html' %}
{% block title %}Vitals Chart{% endblock %}
{% block page_title %}Vitals Chart - {{ patient.full_name }}{% endblock %}
{% block content %}
<div class="row g-4">
    <div class="col-md-6">
        <div class="card"><div class="card-header">Heart Rate</div><div class="card-body"><canvas id="heartRateChart"></canvas></div></div>
    </div>
    <div class="col-md-6">
        <div class="card"><div class="card-header">Blood Pressure</div><div class="card-body"><canvas id="bpChart"></canvas></div></div>
    </div>
    <div class="col-md-6">
        <div class="card"><div class="card-header">Temperature</div><div class="card-body"><canvas id="tempChart"></canvas></div></div>
    </div>
    <div class="col-md-6">
        <div class="card"><div class="card-header">SpO2</div><div class="card-body"><canvas id="spo2Chart"></canvas></div></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
fetch('{% url "vitals:vitals_chart_data" patient.pk %}')
    .then(r => r.json())
    .then(data => {
        const opts = {responsive: true, plugins: {legend: {display: false}}};
        new Chart(document.getElementById('heartRateChart'), {type: 'line', data: {labels: data.labels, datasets: [{label: 'HR', data: data.heart_rate, borderColor: '#dc3545', backgroundColor: 'rgba(220,53,69,0.1)', fill: true, tension: 0.3}]}, options: opts});
        new Chart(document.getElementById('bpChart'), {type: 'line', data: {labels: data.labels, datasets: [{label: 'Systolic', data: data.systolic_bp, borderColor: '#02c39a', backgroundColor: 'rgba(2,195,154,0.1)', fill: true, tension: 0.3}, {label: 'Diastolic', data: data.diastolic_bp, borderColor: '#1a1a2e', tension: 0.3}]}, options: {responsive: true}});
        new Chart(document.getElementById('tempChart'), {type: 'line', data: {labels: data.labels, datasets: [{label: 'Temp', data: data.temperature, borderColor: '#f0f3bd', backgroundColor: 'rgba(240,243,189,0.3)', fill: true, tension: 0.3, borderWidth: 3}]}, options: opts});
        new Chart(document.getElementById('spo2Chart'), {type: 'line', data: {labels: data.labels, datasets: [{label: 'SpO2', data: data.spo2, borderColor: '#02c39a', backgroundColor: 'rgba(2,195,154,0.2)', fill: true, tension: 0.3}]}, options: opts});
    });
</script>
{% endblock %}
